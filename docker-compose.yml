services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - app_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
    restart: unless-stopped
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    ports:
      - "4000:4000"
    env_file:
      - .env
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/"]

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data: